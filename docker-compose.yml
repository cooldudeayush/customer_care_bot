# Local Neo4j for the customer operational graph (Phase 4).
#
#   docker compose up -d        # start Neo4j (Browser at http://localhost:7474)
#   docker compose down         # stop it
#
# Then set NEO4J_PASSWORD=password123 in backend/.env and restart the backend —
# it will mirror the seeded business data into the graph on startup. If Neo4j
# isn't running, the bot still works (refund eligibility falls back to SQLite).
#
# To use Neo4j Aura (cloud) instead, skip this and point NEO4J_URI/USER/PASSWORD
# at your Aura instance — the code is identical.

services:
  neo4j:
    image: neo4j:5
    container_name: ccb-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (UI)
      - "7687:7687" # Bolt (driver protocol)
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - ./data/neo4j:/data
